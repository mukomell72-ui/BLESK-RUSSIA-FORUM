<body>

<div class="headerActions"><button class="avatarButton" onclick="openLogin()" title="Профиль">ВХ</button><button class="headerIcon" onclick="navigate('new')" title="Сообщения">▢</button><button class="headerIcon" onclick="toast('Новых уведомлений нет')" title="Уведомления">♧</button><button class="headerIcon" onclick="navigate('activity')" title="Активность">ϟ</button><button class="headerIcon" onclick="openSearch()" title="Поиск">⌕</button><button id="adminTopButton" class="headerIcon adminTopButton hidden" onclick="navigate('admin')" title="Админ-панель">⚙</button><button class="linkBtn" onclick="openLogin()">Вход</button></div>

<div class="subNav"><div class="subInner"><div><a onclick="navigate('new')">Новые сообщения</a><a onclick="navigate('activity')">Недавняя активность</a></div><button class="installBtn" id="installBtn">＋ Установить приложение</button></div></div>
<main class="container">

</main>
<footer><div class="footerInner"><div><b>BLESK RUSSIA</b><p>Независимый игровой форум.</p></div><div class="footerLinks"><a>Обратная связь</a><a>Условия и правила</a><a>Политика конфиденциальности</a><a>Помощь</a></div></div></footer>
<div id="modal" class="modal hidden"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
function cleanBase64(s){let x=String(s||'').replace(/[^A-Za-z0-9+/]/g,'');return x+'='.repeat((4-x.length%4)%4)}
async function ungzip64(s){const b=Uint8Array.from(atob(cleanBase64(s)),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');return await new Response(new Blob([b]).stream().pipeThrough(ds)).text()}
(async()=>{const ver='adminfix4';const load=async names=>(await Promise.all(names.map(async n=>{const r=await fetch(n+'?v='+ver,{cache:'no-store'});if(!r.ok)throw new Error(n+': HTTP '+r.status);return r.text()}))).join('');const css=await ungzip64(await load(['css1.b64','css2.b64','css3.b64','css4.b64']));document.head.append(Object.assign(document.createElement('style'),{textContent:css}));const js=await ungzip64(await load(['af1.b64','af2.b64','af3.b64','af4.b64','af5.b64','af6.b64','af7.b64','af8.b64','af9.b64','af10.b64','af11.b64','af12.b64']));(0,eval)(js)})().catch(e=>{document.body.innerHTML='<pre style="color:white;background:#111;padding:20px;white-space:pre-wrap">Ошибка загрузки форума:\n'+(e&&e.stack?e.stack:e)+'</pre>'});
</script>
</body></html>
