<script>
async function ungzip64(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");return await new Response(new Blob([b]).stream().pipeThrough(ds)).text()}
(async()=>{const css64=await fetch("css.b64").then(r=>r.text());const js64=(await Promise.all([1,2,3,4].map(i=>fetch(`js${i}.b64`).then(r=>r.text())))).join("");const css=await ungzip64(css64.trim());document.head.append(Object.assign(document.createElement("style"),{textContent:css}));const js=await ungzip64(js64.replace(/\s/g,""));(0,eval)(js)})().catch(e=>{document.body.innerHTML='<pre style="color:white;background:#111;padding:20px">'+e+'</pre>'});
</script>
