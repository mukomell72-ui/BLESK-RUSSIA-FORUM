name: BLEZZ RUSSIA — Next.js validation
on:
  push:
    branches: [main]
    paths:
      - 'forum-app/**'
      - '.github/workflows/forum-app-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forum-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forum-app/package-lock.json
      - name: Install and lock dependencies
        run: npm install --no-audit --no-fund
      - name: Compile production bundle
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
