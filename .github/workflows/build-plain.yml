name: Build plain forum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-plain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cat css1.b64 css2.b64 css3.b64 css4.b64 | tr -d '\r\n ' | base64 -d | gzip -dc > style.css
          cat af1.b64 af2.b64 af3.b64 af4.b64 af5.b64 af6p1.b64 af6p2.b64 af6p3.b64 af6p4.b64 af7.b64 af8.b64 af9.b64 af10.b64 af11.b64 af12.b64 | tr -d '\r\n ' | base64 -d | gzip -dc > app.js
          node --check app.js

      - name: Remove runtime fetch loader and force owner admin access
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          app = re.sub(r'if\("serviceWorker"in navigator\)navigator\.serviceWorker\.register\("sw\.js"\)\.catch\(\(\)=>\{\}\);?', '', app)
          app += '''\nsetTimeout(()=>{try{\n  let me=(typeof db!=="undefined"&&db&&Array.isArray(db.users))?db.users.find(u=>u.id===1||u.ownerProtected===true):null;\n  if(me){me.ownerProtected=true;me.adminPanelAccess=true;me.canGrantAdminAccess=true;me.officialVerified=true;if(typeof save==="function")save();if(typeof refreshHeader==="function")refreshHeader();}\n}catch(e){console.warn("owner recovery",e)}},0);\n'''
          Path('app.js').write_text(app, encoding='utf-8')

          html = Path('forum.html').read_text(encoding='utf-8')
          html = re.sub(r'<script>\s*function cleanBase64[\s\S]*?</script>', '<script src="app.js?v=plain8"></script>', html, count=1)
          if 'style.css?v=plain8' not in html:
              html = html.replace('</head>', '<link rel="stylesheet" href="style.css?v=plain8">\n</head>')
          html = html.replace('adminfix4', 'plain8').replace('adminfix3', 'plain8').replace('adminfix2', 'plain8').replace('plain7', 'plain8')
          Path('forum.html').write_text(html, encoding='utf-8')
          Path('index.html').write_text(html, encoding='utf-8')

      - name: Validate generated site
        shell: bash
        run: |
          set -e
          node --check app.js
          grep -q 'style.css?v=plain8' index.html
          grep -q 'app.js?v=plain8' index.html
          ! grep -q 'fetch(' index.html

      - name: Publish generated files
        shell: bash
        run: |
          git config user.name 'BLESK Forum Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js style.css index.html forum.html
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Publish plain forum without runtime fetch loader'
          git push
