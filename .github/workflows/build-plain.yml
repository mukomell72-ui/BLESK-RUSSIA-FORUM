name: Build plain forum

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-plain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source bundles
        shell: bash
        run: |
          set -euo pipefail

          cat v10_p1_01.part v10_p1_02.part v10_p1_03.part v10_p1_04.part v10_p1_05.part v10_p1_06.part > p1.tmp
          cat v10_p3_01.part v10_p3_02.part v10_p3_03.part v10_p3_04.part v10_p3_05.part v10_p3_06.part > p3.tmp

          test "$(git hash-object p1.tmp)" = "95718768674a0e7dd55822e09be067a4799cd117"
          test "$(git hash-object p3.tmp)" = "39c7e003f5d46a6a37efadeeb4fc557c5a6a4217"
          test "$(git hash-object v9_afpair2.b64)" = "e0e7bf93c47449fd41c2f546da2794d77e9aee59"
          test "$(git hash-object v9_afpair4.b64)" = "429659aba03c14c67b4cf7e1ee95ddee954f19be"
          test "$(git hash-object v9_afpair5.b64)" = "3760ed6e23afeead9393edf927c1de87041cabcc"
          test "$(git hash-object v9_afpair6.b64)" = "9fb064aa20b23570a1077aa42d109a241305906d"
          test "$(git hash-object v9_css1.b64)" = "36949c82f4043071b7ab6391f2d1f0c739357ddb"
          test "$(git hash-object v9_css2.b64)" = "16d209cde06e741b774fa327bb292cf7f9f608c2"
          test "$(git hash-object v9_css3.b64)" = "3fe4c99ebc93e3d84351aab043daaafd1ba2e66f"
          test "$(git hash-object v9_css4.b64)" = "476bb401b3ff3e739ea1825af3201acfa9148217"

      - name: Decode CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cat v9_css1.b64 v9_css2.b64 v9_css3.b64 v9_css4.b64 | tr -d '\r\n ' | base64 -d | gzip -dc > style.css
          cat p1.tmp v9_afpair2.b64 p3.tmp v9_afpair4.b64 v9_afpair5.b64 v9_afpair6.b64 | tr -d '\r\n ' | base64 -d | gzip -dc > app.js
          node --check app.js
          test "$(wc -c < app.js)" -gt 100000
          test "$(wc -c < style.css)" -gt 50000

      - name: Build plain GitHub Pages site
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          app = re.sub(r'if\("serviceWorker"in navigator\)navigator\.serviceWorker\.register\("sw\.js"\)\.catch\(\(\)=>\{\}\);?', '', app)
          app += '''\nsetTimeout(()=>{try{\n  let me=(typeof db!=="undefined"&&db&&Array.isArray(db.users))?db.users.find(u=>u.id===1||u.ownerProtected===true||String(u.email||"").toLowerCase()==="lukas@russia.online"||String(u.nick||"").toLowerCase()==="lukas_illusion"):null;\n  if(me){me.ownerProtected=true;me.adminPanelAccess=true;me.canGrantAdminAccess=true;me.officialVerified=true;if(typeof save==="function")save();if(typeof refreshHeader==="function")refreshHeader();}\n}catch(e){console.warn("owner recovery",e)}},0);\n'''
          Path('app.js').write_text(app, encoding='utf-8')

          html = Path('forum.html').read_text(encoding='utf-8')
          html = re.sub(r'<script>\s*function cleanBase64[\s\S]*?</script>', '<script src="app.js?v=plain10"></script>', html, count=1)
          html = re.sub(r'<script>[\s\S]*?loadTextSync[\s\S]*?</script>', '<script src="app.js?v=plain10"></script>', html, count=1)
          html = re.sub(r'<script>[\s\S]*?ungzip64[\s\S]*?</script>', '<script src="app.js?v=plain10"></script>', html, count=1)
          html = re.sub(r'<link rel="stylesheet" href="style\.css\?v=[^"]+">', '', html)
          html = html.replace('</head>', '<link rel="stylesheet" href="style.css?v=plain10">\n</head>')
          html = re.sub(r'<script src="app\.js\?v=[^"]+"></script>', '<script src="app.js?v=plain10"></script>', html)
          Path('forum.html').write_text(html, encoding='utf-8')
          Path('index.html').write_text(html, encoding='utf-8')

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -q 'style.css?v=plain10' index.html
          grep -q 'app.js?v=plain10' index.html
          ! grep -q 'fetch(' index.html
          ! grep -q 'atob(' index.html
          ! grep -q 'loadTextSync' index.html
          ! grep -q 'ungzip64' index.html
          test "$(wc -c < app.js)" -gt 100000
          test "$(wc -c < style.css)" -gt 50000

      - name: Publish generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BLESK Forum Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js style.css index.html forum.html
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Publish verified plain forum v10'
          git push
